<!doctype html>
<html lang="en">

<head>
  <!-- Meta Tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Philipp Schmitt</title>
  <meta name="description" content="Philipp Schmitt — pedantic Site Reliability Engineer.">
  <meta name="author" content="Philipp Schmitt">
  <link rel="canonical" href="https://pschmitt.dev">

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Philipp Schmitt">
  <meta property="og:title" content="Philipp Schmitt">
  <meta property="og:description" content="Philipp Schmitt — pedantic Site Reliability Engineer.">
  <meta property="og:url" content="https://pschmitt.dev">
  <meta property="og:image" content="https://www.gravatar.com/avatar/8635e7a28259cb6da1c6a3c96c75b425?s=400">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Philipp Schmitt">
  <meta name="twitter:description" content="Philipp Schmitt — pedantic Site Reliability Engineer.">
  <meta name="twitter:image" content="https://www.gravatar.com/avatar/8635e7a28259cb6da1c6a3c96c75b425?s=400">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Philipp Schmitt",
    "url": "https://pschmitt.dev",
    "jobTitle": "Site Reliability Engineer",
    "image": "https://www.gravatar.com/avatar/8635e7a28259cb6da1c6a3c96c75b425?s=400",
    "sameAs": [
      "https://github.com/pschmitt",
      "https://www.linkedin.com/in/pschmitt",
      "https://fosstodon.org/@pschmitt"
    ]
  }
  </script>

  <!-- Set theme before first paint to avoid a flash -->
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      var theme = stored || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <style>
    :root {
      --bg: #111827;
      --text: #f9fafb;
      --link: #60a5fa;
      --link-hover: #93c5fd;
      --subtitle: #9ca3af;
      --ring: #60a5fa;
      color-scheme: dark;
    }

    :root[data-theme="light"] {
      --bg: #f8fafc;
      --text: #1f2937;
      --link: #1d4ed8;
      --link-hover: #1e40af;
      --subtitle: #4b5563;
      --ring: #1d4ed8;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
      font-family: "Comic Code", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 28rem;
    }

    .avatar {
      width: 8rem;
      height: 8rem;
      border-radius: 9999px;
      box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.3);
      transition: transform 0.2s ease;
    }

    .avatar:hover {
      transform: scale(1.05);
    }

    .title {
      font-size: 2.25rem;
      font-weight: 600;
      margin: 1.5rem 0 0.5rem;
    }

    .stack {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2rem;
      margin-top: 1.5rem;
    }

    .subtitle {
      font-size: 1.125rem;
      color: var(--subtitle);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0;
    }

    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1rem;
      font-size: 1.125rem;
    }

    nav li,
    .resume-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    nav .icon {
      display: inline-flex;
      justify-content: center;
      width: 1.5rem;
    }

    a {
      color: var(--link);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    a:hover {
      color: var(--link-hover);
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 3px;
      border-radius: 2px;
    }

    #darkModeToggle {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      font-size: 1.5rem;
      line-height: 1;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      transition: transform 0.2s ease;
    }

    #darkModeToggle:hover {
      transform: scale(1.1);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <header class="sr-only">
    <h1>Philipp Schmitt - Personal Website</h1>
  </header>

  <main>
    <a href="https://github.com/pschmitt">
      <img src="https://www.gravatar.com/avatar/8635e7a28259cb6da1c6a3c96c75b425?s=200" alt="Portrait of Philipp Schmitt"
        class="avatar" width="128" height="128" loading="eager">
    </a>
    <h2 class="title">Philipp Schmitt</h2>

    <div class="stack">
      <p class="subtitle">
        <span class="icon" aria-hidden="true">🌻</span>
        Pedantic, <a href="https://www.linkedin.com/in/pschmitt">SRE</a>
      </p>

      <nav aria-label="Main">
        <ul>
          <li>
            <a href="https://github.com/pschmitt">
              <span class="icon" aria-hidden="true">⌨️</span> GitHub
            </a>
          </li>
          <li>
            <a href="https://fosstodon.org/@pschmitt">
              <span class="icon" aria-hidden="true">🐘</span> Mastodon
            </a>
          </li>
          <li class="resume-row">
            <span class="icon" aria-hidden="true">📄</span>
            <a href="./resume-pschmitt-2024.pdf">Resume</a>
            <span>-</span>
            <a href="./resume-pschmitt-2024-tldr.pdf">tl;dr</a>
          </li>
          <li>
            <a href="https://keybase.io/pschmitt/key.asc">
              <span class="icon" aria-hidden="true">🔑</span> GPG Public Key
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </main>

  <button id="darkModeToggle" aria-label="Toggle dark mode">🌓</button>

  <script>
    var toggle = document.getElementById('darkModeToggle');
    var root = document.documentElement;

    toggle.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      root.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  </script>
</body>

</html>
